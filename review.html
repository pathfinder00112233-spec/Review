<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening Review...</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 40px 20px;
      background: #f8fafc;
      color: #0f172a;
    }
    .card {
      background: #fff;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      max-width: 400px;
      margin: 0 auto;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 16px;
      margin-top: 20px;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      background: #0284c7;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
    .preview {
      margin-top: 15px;
      padding: 12px;
      background: #f1f5f9;
      border-radius: 8px;
      font-style: italic;
      font-size: 14px;
      color: #334155;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Thank You for Visiting! 😊</h2>
    <p>We've prepared a quick review for you:</p>
    
    <div id="reviewText" class="preview">Loading...</div>

    <button class="btn" onclick="copyAndRedirect()">
      📋 Copy & Open Google Review
    </button>
  </div>

  <script>
    // 15 randomized variations packed with target keywords
    const reviews = [
      "Had a completely painless root canal treatment by Dr. [Name]. Extremely hygienic setup and polite staff in Rohtak.",
      "Got my dental implant placed here. Very smooth procedure, modern 3D scanning, and comfortable chewing now.",
      "Best dental clinic in Rohtak! Dr. [Name] resolved my severe tooth pain quickly with a painless RCT.",
      "Started my clear aligners treatment here. The digital scan was quick and the clinic is very modern.",
      "Replaced two missing teeth with dental implants. Natural look, zero discomfort, and honest pricing.",
      "Brought my family for routine checkup and cleaning. Thorough dental work and very patient doctor.",
      "Had an emergency wisdom tooth pain. The extraction was done in 15 minutes with zero pain. Highly recommend!",
      "Very gentle and skilled dentist in Rohtak. Explained my dental implant procedure clearly before starting.",
      "Painless single-sitting root canal. Clean clinic environment, modern equipment, and no waiting time.",
      "Got aesthetic composite bonding done for my chipped tooth. My smile looks brand new. Thank you Dr. [Name]!",
      "Excellent care for senior citizens. My father got his new dentures and dental implants done very comfortably.",
      "Very honest dental advice. Did not push unnecessary treatments. Got a simple filling done smoothly.",
      "State-of-the-art clinic on Delhi Road. The doctor made sure I felt zero pain during my tooth extraction.",
      "Invisible aligners fit comfortably and the treatment progress is right on track. Best cosmetic dentist in Rohtak.",
      "Modern clinic with digital X-rays and painless treatment. Dr. [Name] is very experienced and friendly."
    ];

    // Pick a random review from the list every time the page loads
    const selectedReview = reviews[Math.floor(Math.random() * reviews.length)];
    document.getElementById("reviewText").innerText = '"' + selectedReview + '"';

    const googleReviewURL = "https://search.google.com/local/writereview?placeid=ChIJXe17JYCFDTkRnMoUyag7zP0";

    function copyAndRedirect() {
      navigator.clipboard.writeText(selectedReview).then(() => {
        alert("Review text copied! Just tap 5 stars and paste it into Google.");
        window.location.href = googleReviewURL;
      }).catch(() => {
        window.location.href = googleReviewURL;
      });
    }
  </script>
</body>
</html>
